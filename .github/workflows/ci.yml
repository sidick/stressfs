name: CI

# M0 — Build tooling proven (docs/implementation-plan.md section 3): host
# build + ctest of amiga/lib (ASan/UBSan), an m68k-amigaos cross build of
# the stressfs binary through the pinned toolchain container with a
# binary-size report, and a volamos smoke run of the cross-built binary
# proving the one real ACTION_IS_FILESYSTEM packet end to end.
#
# M1 — Baseline + the first ~20 packets in `stressfs conform` (same
# section): the volamos-smoke job additionally runs `stressfs conform`
# itself. Copperline coverage of the same table against a real FFS
# volume is intentionally NOT in CI (it needs a personal/licensed
# Kickstart ROM + HDF this repo cannot ship); run ci/copperline-m1.sh
# locally instead, same precedent as ci/copperline-m0.sh.
#
# M3 — Quirks file + confidence tiers (same section): host-test also
# runs quirks_test (the parser's unit tests, including malformed files
# and the shipped data/stressfs.quirks file itself); a new quirks-doc
# job regenerates docs/quirks.md from data/stressfs.quirks and fails on
# any byte of drift (the M3 exit criterion "docs/quirks.md regenerates
# byte-identically from the shipped file in CI") and cross-references
# the quirks file's action targets against the conform table's test ids;
# and volamos-smoke additionally proves the quirks CLI end to end
# (loading the shipped file, NOQUIRKS, FORCEQUIRK, and a malformed file
# being refused). The with-and-without-NOQUIRKS verdict comparison
# against a real FFS handler needs a licensed Kickstart ROM + HDF and so
# stays a local script, ci/copperline-m3.sh, like the M0-M2 Copperline
# scripts before it.
#
# M4 — `stressfs random`, portable model only (same section): host-test
# also runs random_test (generator determinism, model logic including
# fold-insensitive names and the content oracle, and a host-simulated
# divergence-detection self-test); volamos-smoke additionally runs
# `stressfs random` twice with the same seed and diffs the two JSON
# reports byte-for-byte (the "SEED=n reproduces the identical operation
# stream ... under volamos" exit criterion), then runs
# RANDOMBREAKMODEL and confirms the deliberately-wrong expectation is
# reported as a divergence. The >= 10000-operation run against real
# FFS V47, and the same SEED-determinism check under Copperline, need
# a licensed Kickstart ROM + HDF this repo cannot ship and so stay a
# local script, ci/copperline-m4.sh, like the M0-M3 Copperline scripts
# before it.
#
# M2 — Report format + verdict/oracle machinery (same section):
# host-test now also runs report_test (the golden-file-validated
# writer tests); volamos-smoke additionally runs ci/report-checker.sh
# against the JSON-lines report the volamos conform run just produced
# ("the seed of phase 4's summariser"). Copperline coverage of the new
# run-identity header and JSON lines is, as with M1, a local-only
# script (ci/copperline-m2.sh) for the same licensed-assets reason.

# M5 (docs/implementation-plan.md section 3's M5 entry): "nightly CI runs
# the Copperline tier green." The honest shape of that, worked out while
# building M5: the REAL three-handler tier (FFS V40, FFS V47, PFS3-AIO)
# needs licensed Kickstart ROMs and a personal FFS V47 HDF this repo
# cannot ship (same caveat as every ci/copperline-*.sh script since M0),
# so it genuinely cannot run unattended on a standard GitHub-hosted
# runner -- it needs a self-hosted runner with those assets pre-staged,
# which does not exist for this project yet. Rather than fake a job that
# claims to be that tier while secretly skipping it, two separate things
# are added instead:
#
#   - `copperline-aros-smoke` (nightly schedule + workflow_dispatch, this
#     file, below): a REAL, GREEN, asset-free Copperline run. Copperline
#     bundles the AROS boot ROM (no Kickstart needed) and amitools builds
#     an FFS "DOS1" HDF from nothing but open tooling, so this boots a
#     real headless Copperline session and sends the one baseline
#     ACTION_IS_FILESYSTEM packet against AROS's own FFS-compatible
#     afs.handler -- proving the actual send/receive path this whole
#     project depends on works end to end on a stock GitHub runner. It is
#     deliberately NOT the full `stressfs conform` table: that was tried
#     against this same AROS+FFS pairing while building M5 and hung (the
#     baseline packet alone consistently returns promptly; the fuller
#     conform run does not, and this session did not have time to root
#     cause why -- see docs/verdict-matrix.md and the M5 session notes).
#     Claiming more than the baseline here would be exactly the "fake a
#     green job" failure mode this comment exists to avoid.
#   - `copperline-nightly-full` (workflow_dispatch ONLY, no schedule):
#     a documented placeholder for the real three-handler tier. It is a
#     TODO, not a working job -- see its own step for exactly what a
#     self-hosted runner would need (the two Kickstart ROMs + the FFS V47
#     HDF ci/copperline-m5.sh's env vars already name) before this can be
#     turned into a real scheduled job.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:17 UTC nightly -- off the hour, same reasoning any "nightly cron"
    # convention uses (avoid the top-of-hour pile-up on shared runners).
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure (STRESSFS_SANITIZERS=ON)
        run: cmake -S amiga -B build-host -DSTRESSFS_SANITIZERS=ON

      - name: Build
        run: cmake --build build-host

      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  # M3: docs/quirks.md is a GENERATED page (ci/quirks-doc.sh) and the
  # proposal promises "the published list can never drift from what the
  # tool actually does". This job is that promise as a gate. Needs no
  # emulator and no licensed assets, so unlike the Copperline tier it
  # runs on every commit.
  quirks-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate docs/quirks.md and diff byte-for-byte
        run: ci/quirks-doc.sh --check

      - name: Cross-reference quirks action targets against the conform table
        # Warn-only at M3 on purpose -- the seeded ACTION_FLUSH and
        # ACTION_MORE_CACHE entries are deliberate forward references to
        # tests phase 2/5 will add. See ci/quirks-check.sh's header.
        run: ci/quirks-check.sh

  cross-build:
    runs-on: ubuntu-latest
    outputs:
      binary-path: build-m68k/stressfs
    steps:
      - uses: actions/checkout@v7

      # Pinned by digest: amigadev/crosstools:m68k-amigaos-gcc10. Despite
      # the "gcc10" tag, this image ships m68k-amigaos-gcc (AmigaDev)
      # 16.2.1b, i.e. GCC 16.2 as referenced elsewhere in the plan — see
      # the note in cmake/m68k-amigaos.toolchain.cmake. There is no
      # vlink in this image; linking goes through m68k-amigaos-gcc /
      # m68k-amigaos-ld (binutils).
      - name: Cross-build for m68k-amigaos
        run: ci/cross-build.sh

      - name: Size report (visibility only — not a hard gate at M0)
        run: |
          SIZE_BYTES=$(stat -c%s build-m68k/stressfs)
          LIMIT_BYTES=$((100 * 1024))

          {
            echo '### m68k-amigaos stressfs binary size'
            echo
            echo "\`build-m68k/stressfs\`: ${SIZE_BYTES} bytes"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SIZE_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::warning::stressfs is ${SIZE_BYTES} bytes, over the ~100KB" \
                 "visibility threshold (docs/implementation-plan.md section 2)." \
                 "Not a build failure at M0 — just flagging the growth."
            echo "**Over the ~100KB visibility threshold.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload cross-built binary
        uses: actions/upload-artifact@v7
        with:
          name: stressfs-m68k
          path: build-m68k/stressfs
          if-no-files-found: error

  volamos-smoke:
    needs: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download cross-built binary
        uses: actions/download-artifact@v8
        with:
          name: stressfs-m68k
          path: build-m68k

      - name: Make binary executable
        run: chmod +x build-m68k/stressfs

      # volamos has no published crate, but its releases ship a prebuilt
      # x86_64-unknown-linux-musl binary, which is far faster to fetch
      # than building from source on every run. Pinned to a specific
      # release tag so a volamos-side regression can't silently break
      # this job — bump deliberately, not by accident. See the volamos
      # skill / ~/src/volamos for the project.
      - name: Install volamos (prebuilt release binary)
        run: |
          set -eu
          VOLAMOS_VERSION="v0.12"
          curl -fsSL -o volamos.tar.gz \
            "https://github.com/sidick/volamos/releases/download/${VOLAMOS_VERSION}/volamos-${VOLAMOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf volamos.tar.gz
          install -m 0755 "volamos-${VOLAMOS_VERSION}-x86_64-unknown-linux-musl/volamos" /usr/local/bin/volamos
          volamos --version

      # -m68020-60 code needs --cpu 68020 or later under volamos; the
      # default --cpu 68000 fails the toolchain's own startup-time CPU
      # check (see cmake/m68k-amigaos.toolchain.cmake and
      # amiga/src/main.c's header comment for the two things that
      # tripped this up while getting M0 working by hand).
      - name: Run stressfs under volamos (default volume, SYS:)
        run: volamos --cpu 68020 build-m68k/stressfs

      - name: Run stressfs under volamos (explicit VOLUME:)
        run: |
          mkdir -p /tmp/stressfs-work
          volamos --cpu 68020 -V WORK:/tmp/stressfs-work build-m68k/stressfs VOLUME WORK:

      # M1 (docs/implementation-plan.md): `stressfs conform` must run
      # to completion against a volamos volume without crashing. This
      # is the CI-safe tier the implementation plan calls out
      # explicitly ("running stressfs conform under volamos in CI is
      # fine and expected... host-side volamos coverage is the
      # CI-safe tier, Copperline stays a documented local verification
      # script", since it needs a licensed Kickstart ROM + HDF this
      # repo cannot ship). volamos only implements DoPkt() for a
      # handful of packet types (see amiga/src/conform.c's header
      # comment), so most table entries legitimately report `fail`
      # here, not `pass` -- that is expected and is itself a finding
      # about volamos's fidelity (docs/implementation-plan.md section
      # 5's "volamos tier fidelity" risk), not a harness bug. The gate
      # is "ran to completion without volamos reporting an unhandled
      # library call", checked via the exit code: stressfs itself uses
      # the M2 exit-code scheme documented in
      # amiga/include/stressfs/conform_run.h -- RETURN_OK(0) all pass,
      # RETURN_WARN(5) at least one fail, RETURN_ERROR(10) at least one
      # inconclusive, RETURN_FAIL(20) could not even start. All four are
      # "the run completed and reported something", which is this job's
      # bar; volamos's own process exit code is whatever stressfs
      # returned, so anything in 0-20 here means the run completed and
      # this step should not fail CI on it.
      - name: Run stressfs conform under volamos
        run: |
          mkdir -p /tmp/stressfs-conform-work
          set +e
          volamos --cpu 68020 -V WORK:/tmp/stressfs-conform-work \
            build-m68k/stressfs VOLUME WORK: TIER volamos SEED 1 CONFORM
          rc=$?
          set -e
          echo "stressfs conform exit code under volamos: $rc"
          if [ "$rc" -gt 20 ]; then
            echo "::error::stressfs conform under volamos exited $rc (expected 0-20: it should" \
                 "complete the run, not crash or hang)"
            exit 1
          fi

      # M2 (docs/implementation-plan.md section 3's M2 entry): parse the
      # JSON-lines report this run just produced and print verdict
      # counts -- "the seed of phase 4's summariser," run here against a
      # real (volamos-produced) report because volamos output needs no
      # licensed/personal assets, unlike the Copperline tier.
      # M3 (docs/implementation-plan.md M3 steps 3 and 7): prove the
      # quirks CLI end to end on the real cross-built binary, in the
      # CI-safe tier. volamos's own volume answers almost no packets
      # (see the note above), so no seeded FFS quirk can MATCH here --
      # that part is ci/copperline-m3.sh's job against a real handler.
      # What this step does prove, and what would otherwise only be
      # proven by host unit tests, is that the file is found and parsed
      # on the real target, that the load-time warning for the
      # deliberately-unmatchable entry fires, that NOQUIRKS/-K and
      # FORCEQUIRK reach the engine through ReadArgs, and that a
      # malformed file aborts the run instead of being half-applied.
      - name: Prove the quirks CLI under volamos
        run: |
          set -eu
          mkdir -p /tmp/stressfs-quirks-work
          cp data/stressfs.quirks /tmp/stressfs-quirks-work/

          run() {
            volamos --cpu 68020 -V WORK:/tmp/stressfs-quirks-work \
              build-m68k/stressfs VOLUME WORK: TIER volamos SEED 1 CONFORM "$@"
          }

          echo "== 1. the shipped quirks file loads and warns about its unmatchable entry =="
          out="$(run QUIRKS WORK:stressfs.quirks 2>&1 || true)"
          echo "$out" | head -8
          echo "$out" | grep -q "cannot be evaluated by this build" \
            || { echo "::error::the unevaluable-match-key warning did not fire"; exit 1; }
          echo "$out" | grep -q "^stressfs applied quirks:" \
            || { echo "::error::no applied-quirks summary at the top of the report"; exit 1; }

          echo "== 2. NOQUIRKS (-K) suppresses the file entirely =="
          out="$(run QUIRKS WORK:stressfs.quirks -K 2>&1 || true)"
          echo "$out" | grep -q "suppressed by NOQUIRKS" \
            || { echo "::error::-K did not suppress the quirks file"; exit 1; }

          echo "== 3. FORCEQUIRK lifts the confidence gate for a named id =="
          out="$(run QUIRKS WORK:stressfs.quirks FORCEQUIRK pfs3-aio-identity-unexpressible 2>&1 || true)"
          echo "$out" | grep -q "forced by id (FORCEQUIRK)" \
            || { echo "::error::FORCEQUIRK did not force the named entry"; exit 1; }

          echo "== 4. a malformed quirks file is refused, never half-applied =="
          cp amiga/tests/quirks/bad-unknown-verb.quirks /tmp/stressfs-quirks-work/bad.quirks
          set +e
          out="$(run QUIRKS WORK:bad.quirks 2>&1)"
          rc=$?
          set -e
          echo "$out" | head -4
          echo "$out" | grep -q "REFUSING THE WHOLE FILE" \
            || { echo "::error::a malformed quirks file was not loudly refused"; exit 1; }
          if [ "$rc" != 20 ]; then
            echo "::error::a malformed quirks file should abort the run with RETURN_FAIL (20), got $rc"
            exit 1
          fi

      - name: Check the JSON report with ci/report-checker.sh
        # The report file lands under the volamos -V mapping above
        # (/tmp/stressfs-conform-work), not build-m68k/ -- see
        # amiga/src/conform.c's report_file_open() comment for why
        # only a path under an explicitly `-V`-mapped assign gets real
        # host-backed I/O under volamos (relative paths, RAM: and T:
        # are faked there and never touch the host filesystem).
        run: ci/report-checker.sh /tmp/stressfs-conform-work/stressfs-conform-report.json

      # M4 (docs/implementation-plan.md M4 entry): "SEED=n reproduces
      # the identical operation stream ... under volamos" -- run
      # `stressfs random` twice with the same seed against a volamos
      # volume and diff the two JSON-lines reports byte-for-byte.
      # volamos only implements DoPkt() for a handful of packet types
      # (see amiga/src/conform.c's own header comment on this), so
      # most of the file-operation wrapper calls `random` makes here
      # legitimately fail against it -- that is fine and expected: the
      # determinism property under test is about the GENERATOR
      # reproducing the same stream and the same comparisons, not
      # about volamos behaving like a real handler (which is exactly
      # why the real >= 10000-op FFS run is Copperline's job, in
      # ci/copperline-m4.sh, not this one's).
      - name: Prove SEED determinism of `stressfs random` under volamos
        run: |
          set -eu
          mkdir -p /tmp/stressfs-random-work-a /tmp/stressfs-random-work-b

          volamos --cpu 68020 -V WORK:/tmp/stressfs-random-work-a \
            build-m68k/stressfs VOLUME WORK: TIER volamos SEED 42 RANDOM OPS 200 || true
          volamos --cpu 68020 -V WORK:/tmp/stressfs-random-work-b \
            build-m68k/stressfs VOLUME WORK: TIER volamos SEED 42 RANDOM OPS 200 || true

          A=/tmp/stressfs-random-work-a/stressfs-random-report.json
          B=/tmp/stressfs-random-work-b/stressfs-random-report.json
          if [ ! -f "$A" ] || [ ! -f "$B" ]; then
            echo "::error::one or both SEED=42 runs produced no JSON report" >&2
            exit 1
          fi
          if ! diff -q "$A" "$B" >/dev/null; then
            echo "::error::two runs with the same SEED produced DIFFERENT reports" >&2
            diff "$A" "$B" | head -20 >&2
            exit 1
          fi
          echo "OK: SEED=42 reproduced the identical operation stream across two volamos runs"

      # M4: the self-test switch, mirroring M1's SELFTESTHANG
      # demonstration under volamos -- a deliberately corrupted model
      # expectation must be reported as a divergence end to end.
      - name: Prove divergence detection with RANDOMBREAKMODEL under volamos
        run: |
          set -eu
          mkdir -p /tmp/stressfs-random-selftest
          set +e
          volamos --cpu 68020 -V WORK:/tmp/stressfs-random-selftest \
            build-m68k/stressfs VOLUME WORK: TIER volamos SEED 1 RANDOM RANDOMBREAKMODEL
          rc=$?
          set -e
          echo "RANDOMBREAKMODEL exit code: $rc"
          if [ "$rc" != 10 ]; then
            echo "::error::RANDOMBREAKMODEL should exit RETURN_ERROR (10) when the divergence" \
                 "is correctly detected, got $rc" >&2
            exit 1
          fi
          grep -q '"diverged":true' /tmp/stressfs-random-selftest/stressfs-random-report.json \
            || { echo "::error::no diverged:true line in the self-test report"; exit 1; }
          echo "OK: the deliberately corrupted expectation was reported as a divergence"

  # M5: the real, asset-free Copperline tier -- see this file's top
  # comment for the full "why this and not the real three-handler tier"
  # reasoning. macos-latest because Copperline's only packaged
  # distribution (the linuxjedi/copperline Homebrew tap) requires macOS;
  # there is no Linux package to install here the way volamos-smoke
  # installs a prebuilt Linux volamos binary.
  copperline-aros-smoke:
    needs: cross-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download cross-built binary
        uses: actions/download-artifact@v8
        with:
          name: stressfs-m68k
          path: build-m68k

      - name: Make binary executable
        run: chmod +x build-m68k/stressfs

      - name: Install Copperline (Homebrew tap)
        # The tap's Formula lives inside the main project repo itself
        # (CopperlineHQ/Copperline, after the project's move from
        # linuxjedi/Copperline), not in a separate "homebrew-copperline"
        # repo -- `brew tap linuxjedi/copperline` with no URL looks for
        # the now-nonexistent github.com/linuxjedi/homebrew-copperline
        # by Homebrew's naming convention and fails (observed on CI:
        # exit 128, "could not read Username for 'https://github.com'",
        # since the 404 trips a credential prompt in a non-interactive
        # shell). The explicit URL is what actually works, matching how
        # this machine's own local tap is configured.
        run: |
          brew tap linuxjedi/copperline https://github.com/CopperlineHQ/Copperline
          brew install copperline
          copperline --version

      - name: Install amitools (rdbtool/xdftool)
        run: pip3 install --break-system-packages amitools

      - name: Build a fresh FFS "DOS1" HDF (amitools only, no licensed assets)
        # Same construction ci/m5/build-ffs-v40-hdf.sh uses locally,
        # inlined here rather than sourcing that script's exact ROM
        # assumptions (it is written for the FFS V40 ROM-resident case,
        # which has no bearing on booting it under AROS instead).
        run: |
          set -eu
          OUT="$RUNNER_TEMP/aros-smoke.hdf"
          rdbtool "$OUT" create size=20Mi + init + add size=100% name=Work bootable dostype=ffs
          xdftool "$OUT" open part=Work + format Work ffs
          echo "HDF=$OUT" >> "$GITHUB_ENV"

      - name: Boot Copperline (bundled AROS, no Kickstart) and send the baseline packet
        # No `rom =` key at all: Copperline boots its bundled AROS ROM.
        # `--run`/`--exit-on-return`, same standing headless-only rule
        # every ci/copperline-*.sh script in this repo follows.
        run: |
          set -eu
          printf '[machine]\nprofile = "A1200"\n\n[ide]\nmaster = "%s"\n' "$HDF" \
            > "$RUNNER_TEMP/aros-smoke.toml"
          rc=0
          timeout 60 copperline --config "$RUNNER_TEMP/aros-smoke.toml" --noaudio \
            --run build-m68k/stressfs --run-args "VOLUME Work: TIER aros-smoke" \
            --exit-on-return || rc=$?
          echo "stressfs exit code under AROS: $rc"
          # Hello-world mode (M0's own contract): RETURN_WARN(5) is the
          # expected "ran, printed a result" outcome -- see
          # ci/copperline-m0.sh and amiga/src/main.c. 124 is the `timeout`
          # above firing, which IS a failure for this specific baseline
          # packet (unlike the full conform table, this one packet
          # reliably returns quickly against this AROS+FFS pairing, per
          # this file's top comment).
          if [ "$rc" != 5 ] && [ "$rc" != 0 ]; then
            echo "::error::expected exit 0 or 5 (RETURN_OK/RETURN_WARN), got $rc"
            exit 1
          fi

  # M5: documented placeholder for the REAL three-handler nightly tier
  # (FFS V40, FFS V47, PFS3-AIO) -- NOT wired to `schedule:`, intentionally.
  # This is honesty-over-appearance: the job below does not run anything
  # yet because doing so needs assets no standard GitHub-hosted runner can
  # have (two licensed Kickstart ROMs, plus the personal FFS V47 HDF
  # every ci/copperline-*.sh script since M0 has needed). Turning this
  # into a real job needs a SELF-HOSTED runner with those assets staged
  # and the same env vars ci/copperline-m5.sh already reads
  # (COPPERLINE_ROM_V47, COPPERLINE_HDF_V47, COPPERLINE_ROM_V40) pointed
  # at them, plus a `runs-on: [self-hosted, ...]` label and a `schedule:`
  # trigger once that runner exists. TODO, not yet done.
  copperline-nightly-full:
    needs: cross-build
    runs-on: ubuntu-latest
    # workflow_dispatch only -- never runs on the `schedule:` trigger
    # above, so it cannot silently claim nightly coverage it does not
    # provide. See this job's header comment.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Explain the gap rather than fake a green run
        run: |
          echo "## Copperline nightly tier: not yet runnable on a GitHub-hosted runner" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "FFS V40, FFS V47 and PFS3-AIO all need licensed/personal Kickstart ROM" >> "$GITHUB_STEP_SUMMARY"
          echo "and HDF assets this repo cannot ship (same caveat as ci/copperline-m5.sh" >> "$GITHUB_STEP_SUMMARY"
          echo "and every ci/copperline-*.sh script before it). This job is a deliberate" >> "$GITHUB_STEP_SUMMARY"
          echo "placeholder, not a working tier: it needs a self-hosted runner with those" >> "$GITHUB_STEP_SUMMARY"
          echo "assets staged and COPPERLINE_ROM_V47/COPPERLINE_HDF_V47/COPPERLINE_ROM_V40" >> "$GITHUB_STEP_SUMMARY"
          echo "pointed at them (see ci/copperline-m5.sh's own usage comment), at which" >> "$GITHUB_STEP_SUMMARY"
          echo "point this job's \`runs-on:\` and \`if:\` should both change." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "In the meantime, \`copperline-aros-smoke\` (this same workflow) IS a real," >> "$GITHUB_STEP_SUMMARY"
          echo "green, nightly-scheduled Copperline run that needs no licensed assets --" >> "$GITHUB_STEP_SUMMARY"
          echo "see its own job for what it does and does not prove." >> "$GITHUB_STEP_SUMMARY"
