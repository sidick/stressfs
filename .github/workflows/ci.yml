name: CI

# M0 — Build tooling proven (docs/implementation-plan.md section 3): host
# build + ctest of amiga/lib (ASan/UBSan), an m68k-amigaos cross build of
# the stressfs binary through the pinned toolchain container with a
# binary-size report, and a volamos smoke run of the cross-built binary
# proving the one real ACTION_IS_FILESYSTEM packet end to end.
#
# M1 — Baseline + the first ~20 packets in `stressfs conform` (same
# section): the volamos-smoke job additionally runs `stressfs conform`
# itself. Copperline coverage of the same table against a real FFS
# volume is intentionally NOT in CI (it needs a personal/licensed
# Kickstart ROM + HDF this repo cannot ship); run ci/copperline-m1.sh
# locally instead, same precedent as ci/copperline-m0.sh.
#
# M2 — Report format + verdict/oracle machinery (same section):
# host-test now also runs report_test (the golden-file-validated
# writer tests); volamos-smoke additionally runs ci/report-checker.sh
# against the JSON-lines report the volamos conform run just produced
# ("the seed of phase 4's summariser"). Copperline coverage of the new
# run-identity header and JSON lines is, as with M1, a local-only
# script (ci/copperline-m2.sh) for the same licensed-assets reason.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure (STRESSFS_SANITIZERS=ON)
        run: cmake -S amiga -B build-host -DSTRESSFS_SANITIZERS=ON

      - name: Build
        run: cmake --build build-host

      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  cross-build:
    runs-on: ubuntu-latest
    outputs:
      binary-path: build-m68k/stressfs
    steps:
      - uses: actions/checkout@v7

      # Pinned by digest: amigadev/crosstools:m68k-amigaos-gcc10. Despite
      # the "gcc10" tag, this image ships m68k-amigaos-gcc (AmigaDev)
      # 16.2.1b, i.e. GCC 16.2 as referenced elsewhere in the plan — see
      # the note in cmake/m68k-amigaos.toolchain.cmake. There is no
      # vlink in this image; linking goes through m68k-amigaos-gcc /
      # m68k-amigaos-ld (binutils).
      - name: Cross-build for m68k-amigaos
        run: ci/cross-build.sh

      - name: Size report (visibility only — not a hard gate at M0)
        run: |
          SIZE_BYTES=$(stat -c%s build-m68k/stressfs)
          LIMIT_BYTES=$((100 * 1024))

          {
            echo '### m68k-amigaos stressfs binary size'
            echo
            echo "\`build-m68k/stressfs\`: ${SIZE_BYTES} bytes"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SIZE_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::warning::stressfs is ${SIZE_BYTES} bytes, over the ~100KB" \
                 "visibility threshold (docs/implementation-plan.md section 2)." \
                 "Not a build failure at M0 — just flagging the growth."
            echo "**Over the ~100KB visibility threshold.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload cross-built binary
        uses: actions/upload-artifact@v7
        with:
          name: stressfs-m68k
          path: build-m68k/stressfs
          if-no-files-found: error

  volamos-smoke:
    needs: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download cross-built binary
        uses: actions/download-artifact@v8
        with:
          name: stressfs-m68k
          path: build-m68k

      - name: Make binary executable
        run: chmod +x build-m68k/stressfs

      # volamos has no published crate, but its releases ship a prebuilt
      # x86_64-unknown-linux-musl binary, which is far faster to fetch
      # than building from source on every run. Pinned to a specific
      # release tag so a volamos-side regression can't silently break
      # this job — bump deliberately, not by accident. See the volamos
      # skill / ~/src/volamos for the project.
      - name: Install volamos (prebuilt release binary)
        run: |
          set -eu
          VOLAMOS_VERSION="v0.12"
          curl -fsSL -o volamos.tar.gz \
            "https://github.com/sidick/volamos/releases/download/${VOLAMOS_VERSION}/volamos-${VOLAMOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf volamos.tar.gz
          install -m 0755 "volamos-${VOLAMOS_VERSION}-x86_64-unknown-linux-musl/volamos" /usr/local/bin/volamos
          volamos --version

      # -m68020-60 code needs --cpu 68020 or later under volamos; the
      # default --cpu 68000 fails the toolchain's own startup-time CPU
      # check (see cmake/m68k-amigaos.toolchain.cmake and
      # amiga/src/main.c's header comment for the two things that
      # tripped this up while getting M0 working by hand).
      - name: Run stressfs under volamos (default volume, SYS:)
        run: volamos --cpu 68020 build-m68k/stressfs

      - name: Run stressfs under volamos (explicit VOLUME:)
        run: |
          mkdir -p /tmp/stressfs-work
          volamos --cpu 68020 -V WORK:/tmp/stressfs-work build-m68k/stressfs VOLUME WORK:

      # M1 (docs/implementation-plan.md): `stressfs conform` must run
      # to completion against a volamos volume without crashing. This
      # is the CI-safe tier the implementation plan calls out
      # explicitly ("running stressfs conform under volamos in CI is
      # fine and expected... host-side volamos coverage is the
      # CI-safe tier, Copperline stays a documented local verification
      # script", since it needs a licensed Kickstart ROM + HDF this
      # repo cannot ship). volamos only implements DoPkt() for a
      # handful of packet types (see amiga/src/conform.c's header
      # comment), so most table entries legitimately report `fail`
      # here, not `pass` -- that is expected and is itself a finding
      # about volamos's fidelity (docs/implementation-plan.md section
      # 5's "volamos tier fidelity" risk), not a harness bug. The gate
      # is "ran to completion without volamos reporting an unhandled
      # library call", checked via the exit code: stressfs itself uses
      # the M2 exit-code scheme documented in
      # amiga/include/stressfs/conform_run.h -- RETURN_OK(0) all pass,
      # RETURN_WARN(5) at least one fail, RETURN_ERROR(10) at least one
      # inconclusive, RETURN_FAIL(20) could not even start. All four are
      # "the run completed and reported something", which is this job's
      # bar; volamos's own process exit code is whatever stressfs
      # returned, so anything in 0-20 here means the run completed and
      # this step should not fail CI on it.
      - name: Run stressfs conform under volamos
        run: |
          mkdir -p /tmp/stressfs-conform-work
          set +e
          volamos --cpu 68020 -V WORK:/tmp/stressfs-conform-work \
            build-m68k/stressfs VOLUME WORK: TIER volamos SEED 1 CONFORM
          rc=$?
          set -e
          echo "stressfs conform exit code under volamos: $rc"
          if [ "$rc" -gt 20 ]; then
            echo "::error::stressfs conform under volamos exited $rc (expected 0-20: it should" \
                 "complete the run, not crash or hang)"
            exit 1
          fi

      # M2 (docs/implementation-plan.md section 3's M2 entry): parse the
      # JSON-lines report this run just produced and print verdict
      # counts -- "the seed of phase 4's summariser," run here against a
      # real (volamos-produced) report because volamos output needs no
      # licensed/personal assets, unlike the Copperline tier.
      - name: Check the JSON report with ci/report-checker.sh
        # The report file lands under the volamos -V mapping above
        # (/tmp/stressfs-conform-work), not build-m68k/ -- see
        # amiga/src/conform.c's report_file_open() comment for why
        # only a path under an explicitly `-V`-mapped assign gets real
        # host-backed I/O under volamos (relative paths, RAM: and T:
        # are faked there and never touch the host filesystem).
        run: ci/report-checker.sh /tmp/stressfs-conform-work/stressfs-conform-report.json
